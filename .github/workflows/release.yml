name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"   # macOS 14+ (arm64 runner, builds native Apple Silicon app by default)
            args: ""
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install Rust stable (macOS)
        if: contains(matrix.platform, 'macos')
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal macOS builds require both x86_64 and aarch64 targets
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: install Rust stable (others)
        if: "!contains(matrix.platform, 'macos')"
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── Linux system dependencies ──────────────────────────────────────────
      - name: install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: install frontend dependencies
        run: npm install

      # ── Build & publish ────────────────────────────────────────────────────
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        with:
          tagName: v__VERSION__          # __VERSION__ is replaced with the version from tauri.conf.json
          releaseName: "Workshop v__VERSION__"
          releaseBody: "See the assets below to download the latest version of Workshop."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
